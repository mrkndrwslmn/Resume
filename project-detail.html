<!DOCTYPE html>

  <style>
    /* Mockup frames for dynamic content */
    .mockup-browser {
      border: 2px solid black;
      border-radius: 12px;
      overflow: hidden;
      background: black;
      margin-bottom: 2rem;
    }
    .mockup-browser-header {
      border-bottom: 2px solid black;
      background: var(--bg-color);
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
    }
    .mockup-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid black;
    }
    .mockup-dot:nth-child(1) { background: #ff5f56; }
    .mockup-dot:nth-child(2) { background: #ffbd2e; }
    .mockup-dot:nth-child(3) { background: #27c93f; }
  </style>
</head>
<body class="antialiased bg-[var(--bg-color)]">
  
  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 bg-[var(--bg-color)] border-b-2 border-black z-50 py-4">

      <a href="index.html" class="text-2xl font-black font-display tracking-tight text-black">

      </a>

        <a href="index.html" class="hover:text-[var(--accent-dark)] transition-colors">Home</a>

        ← Back to Projects
      </a>
      
      <button id="mobile-menu-btn" class="md:hidden text-black font-bold uppercase">Menu</button>
    </div>
    
    <div id="mobile-menu" class="hidden md:hidden border-t-2 border-black mt-4 bg-[var(--bg-color)]">

    <div id="project-detail-loading" class="text-center py-24">
      <p class="font-mono text-sm uppercase tracking-widest text-black animate-pulse">Loading case study...</p>

    <!-- Container for dynamic injection -->
    <div id="project-detail-container">
      <!-- JS injects project details here -->

  <script src="supabase-client.js"></script>
  <script>
    document.getElementById('mobile-menu-btn').addEventListener('click', function() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
